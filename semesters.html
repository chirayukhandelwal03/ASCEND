<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B2A4A">
  <title>Semesters — ASCEND</title>
  <meta name="description" content="Choose your semester to access curated academic resources.">
  <meta property="og:title" content="Semesters — ASCEND">
  <meta property="og:image" content="New_Logo_Top.png">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="explore.css">
</head>
<body>
<div id="navbar-root"></div><div id="breadcrumb-root"></div>
<section class="page-header" id="page-header"><div class="container">
  <h1 class="page-title fade-up" id="page-title"></h1>
  <p class="page-subtitle fade-up fade-up-delay-1" id="page-subtitle"></p>
</div></section>
<section class="semesters-page"><div class="container">
  <div class="semester-grid" id="semester-grid"></div>
</div></section>
<section class="cta-banner"><div class="container"><div class="cta-banner-content fade-up">
  <div class="cta-banner-text"><h3>Not sure where to start?</h3>
    <p>Begin with Semester 1. Every journey starts with a strong foundation.</p>
    <a href="#" class="btn-primary" id="cta-link">Start with Semester 1 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
  </div><div class="cta-banner-image"><img src="legacy-art.png" alt="Students" loading="lazy"></div>
</div></div></section>
<div id="footer-root"></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
  const courseId = getParam('course') || 'core';
  const course = getCourse(courseId);
  if (!course) { window.location.href = 'courses.html'; return; }
  document.title = `${course.name} — Semesters — ASCEND`;
  createNavbar('courses'); createFooter();
  document.getElementById('breadcrumb-root').innerHTML = createBreadcrumb([
    {label:'Home',href:'index.html'},{label:'Courses',href:'courses.html'},{label:course.name}
  ]);
  document.getElementById('page-title').textContent = `${course.name} — Explore by Semester`;
  document.getElementById('page-subtitle').textContent = course.description;
  document.getElementById('cta-link').href = `semester?course=${courseId}&id=1`;
  const grid = document.getElementById('semester-grid');
  course.semesters.forEach((sem,i) => {
    grid.innerHTML += `<a href="semester?course=${courseId}&id=${sem.id}" class="semester-card fade-up fade-up-delay-${i+1}">
      <div class="semester-icon">${SEM_ICONS[sem.id]}</div>
      <div class="semester-number">${sem.name}</div>
      <div class="semester-desc">${sem.tagline}</div>
      <div class="semester-meta">${sem.subjects.length} Subjects · ${sem.totalCredits} Credits</div>
      <div class="semester-link">Explore Subjects <span>→</span></div></a>`;
  });
  initPage();
})();
</script>
</body>
</html>
