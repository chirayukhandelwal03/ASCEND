<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B2A4A">
  <title>Resource — ASCEND</title>
  <meta name="description" content="View and download academic resource.">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="explore.css">
  <meta property="og:title" content="Resource — ASCEND">
  <meta property="og:image" content="New_Logo_Top.png">
</head>
<body>
<div id="navbar-root"></div><div id="breadcrumb-root"></div>
<section class="resource-page" id="main-content"><div class="container">
  <div class="resource-header fade-up"><h1 class="resource-page-title" id="res-title"></h1><div class="resource-page-meta" id="res-meta"></div></div>
  <div class="resource-layout">
    <div class="resource-viewer fade-up fade-up-delay-1">
      <div class="pdf-viewer" id="pdf-viewer">
        <div class="pdf-toolbar"><div class="pdf-filename" id="pdf-filename"></div><div class="pdf-controls"><a href="#" id="pdf-open-tab" target="_blank" style="color:var(--gray-500);font-size:12px;text-decoration:none">Open in new tab ↗</a></div></div>
        <div class="pdf-embed-container" id="pdf-embed-container">
          <iframe id="pdf-iframe" style="width:100%;height:100%;border:none;display:none"></iframe>
          <div class="pdf-content" id="pdf-mock">
            <div class="pdf-mock-page"><div class="pdf-mock-header"><div class="pdf-mock-logo"></div><div class="pdf-mock-title-block"><div class="pdf-mock-uni">UNIVERSITY EXAMINATION</div><div class="pdf-mock-exam" id="pdf-mock-exam"></div><div class="pdf-mock-date" id="pdf-mock-date"></div></div></div><div class="pdf-mock-body"><p><strong>Time: 3 Hours</strong> <span style="float:right"><strong>Marks: 100</strong></span></p><p style="margin-top:12px"><em>Note: Attempt all questions.</em></p><div class="pdf-mock-section"><p><strong>Q1.</strong> Explain the concept with examples.</p><p><strong>Q2.</strong> Prepare the statement with given data.</p><p><strong>Q3.</strong> Analyze and compute the required values.</p></div></div></div>
          </div>
        </div>
      </div>
      <div class="resource-about"><h3>About this resource</h3><p id="res-description"></p></div>
    </div>
    <div class="resource-sidebar fade-up fade-up-delay-2">
      <div class="details-card"><h4>Details</h4><div class="detail-list" id="detail-list"></div></div>
      <a href="#" class="btn-primary download-btn" id="download-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download PDF</a>
      <a href="#" class="btn-secondary subject-back-link" id="subject-link" style="width:100%;justify-content:center;font-size:13px;padding:10px 20px;margin-bottom:12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> View Subject Page</a>
      <button class="report-link" id="report-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg> Report an issue</button>
    </div>
  </div>
</div></section>
<div id="footer-root"></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
  const courseId=getParam('course')||'core',semId=getParam('sem')||'1',subId=getParam('sub'),resId=getParam('id');
  const course=getCourse(courseId),sem=getSemester(courseId,semId),sub=getSubject(courseId,semId,subId),res=resId?getResource(subId,resId):null;
  if(!course||!sem||!sub||!res){window.location.href=`subject?course=${courseId}&sem=${semId}&sub=${subId}`;return}
  document.title=`${res.title} — ASCEND`;
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', `${res.title} — ASCEND`);
  createNavbar('courses');createFooter();
  let resCat='End Sem';const allRes=RESOURCES[subId];if(allRes){for(const[cat,items]of Object.entries(allRes)){if(items.find(r=>r.id===resId)){resCat=resTypeLabel(cat);break}}}
  document.getElementById('breadcrumb-root').innerHTML=createBreadcrumb([{label:'Home',href:'index.html'},{label:'Courses',href:'courses.html'},{label:course.name,href:`semesters?course=${courseId}`},{label:sem.name,href:`semester?course=${courseId}&id=${semId}`},{label:sub.name,href:`subject?course=${courseId}&sem=${semId}&sub=${subId}`},{label:resCat}]);
  document.getElementById('res-title').textContent=res.title;
  document.getElementById('res-meta').innerHTML=`<span class="meta-badge">${res.fileType}</span><span class="meta-item">${res.size}</span><span class="meta-sep">&middot;</span><span class="meta-item">Uploaded on ${res.date}</span>${res.verified?'<span class="meta-sep">&middot;</span><span class="meta-verified">Verified</span>':''}`;
  document.getElementById('res-description').textContent=res.description;
  document.getElementById('pdf-filename').textContent=`${res.title}.pdf`;
  document.getElementById('pdf-mock-exam').textContent=resCat.toUpperCase();
  document.getElementById('pdf-mock-date').textContent=res.date;

  // Embed actual PDF if driveLink exists
  if (res.driveLink) {
    const isGDrive = res.driveLink.includes('drive.google.com');
    const embedUrl = isGDrive
      ? res.driveLink.replace('/view','/preview')
      : res.driveLink;
    const iframe = document.getElementById('pdf-iframe');
    iframe.src = embedUrl;
    iframe.style.display = 'block';
    document.getElementById('pdf-mock').style.display = 'none';
    // Error state for failed iframe loads
    iframe.addEventListener('error', function() {
      iframe.style.display = 'none';
      document.getElementById('pdf-mock').style.display = 'flex';
      document.getElementById('pdf-mock').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-muted)"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--gray-300)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><p style="margin-top:16px;font-size:15px">Unable to load the PDF preview.</p><p style="margin-top:8px;font-size:13px">Try opening it in a new tab or downloading directly.</p></div>';
    });
    // Timeout fallback — if iframe takes too long
    setTimeout(function() {
      if (iframe.contentDocument === null || iframe.contentWindow === null) return; // cross-origin, can't check
    }, 15000);
    // Open in new tab — for Drive use the /view URL
    const viewUrl = isGDrive
      ? res.driveLink.replace('/preview','/view')
      : res.driveLink;
    document.getElementById('pdf-open-tab').href = viewUrl;
    // Download button — for Drive use /export URL, for local use direct path
    if (isGDrive) {
      const fileId = res.driveLink.match(/\/d\/([^/]+)/)?.[1];
      document.getElementById('download-btn').href = fileId
        ? `https://drive.google.com/uc?export=download&id=${fileId}`
        : viewUrl;
    } else {
      document.getElementById('download-btn').href = res.driveLink;
      document.getElementById('download-btn').setAttribute('download', `${res.title}.pdf`);
    }
  } else {
    document.getElementById('pdf-open-tab').style.display = 'none';
    document.getElementById('download-btn').style.opacity = '0.5';
    document.getElementById('download-btn').style.pointerEvents = 'none';
    document.getElementById('download-btn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Coming Soon';
  }

  const details=[{l:'Type',v:resCat},{l:'Course',v:course.name},{l:'Semester',v:sem.name},{l:'Subject',v:sub.name},{l:'Attempt',v:res.attempt||'—'},{l:'Uploaded By',v:res.uploadedBy},{l:'Batch',v:res.batch},{l:'Upload Date',v:res.date},{l:'Views',v:res.views.toLocaleString()},{l:'Downloads',v:res.downloads.toLocaleString()}];
  document.getElementById('detail-list').innerHTML=details.map(d=>`<div class="detail-row"><span class="detail-label">${d.l}</span><span class="detail-value">${d.v}</span></div>`).join('');
  document.getElementById('subject-link').href=`subject?course=${courseId}&sem=${semId}&sub=${subId}`;
  document.getElementById('report-btn').addEventListener('click',()=>alert('Thank you for reporting.'));
  initPage();
  addToRecentlyViewed({id:resId, title:res.title, course:courseId, sem:semId, sub:subId, type:resCat, fileType:res.fileType});
})();
</script>
</body>
</html>
