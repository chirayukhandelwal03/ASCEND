<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B2A4A">
  <title>Page Not Found — ASCEND</title>
  <meta name="description" content="The page you're looking for doesn't exist.">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="explore.css">
</head>
<body>
<div id="navbar-root"></div>

<section id="main-content" style="padding:140px 0 80px;text-align:center;">
  <div class="container">
    <div class="fade-up" style="margin-bottom:24px;">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1 class="fade-up fade-up-delay-1" style="font-family:'Playfair Display',serif;font-size:48px;color:var(--navy);margin-bottom:12px;">404</h1>
    <p class="fade-up fade-up-delay-2" style="font-size:17px;color:var(--text-muted);margin-bottom:6px;">Page not found</p>
    <p class="fade-up fade-up-delay-2" style="font-size:14px;color:var(--text-muted);max-width:420px;margin:0 auto 32px;">The page you're looking for doesn't exist or has been moved. Try searching or browse the links below.</p>

    <div class="fade-up fade-up-delay-3" style="max-width:480px;margin:0 auto 40px;">
      <form id="search-404" style="display:flex;gap:8px;">
        <div class="explore-search" style="flex:1;margin:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-404-input" placeholder="Search for subjects, resources..." autocomplete="off" style="border:none;outline:none;background:none;font-size:14px;font-family:inherit;color:var(--text-primary);width:100%">
        </div>
        <button type="submit" class="btn-primary" style="padding:12px 20px;font-size:13px;">Search</button>
      </form>
    </div>

    <div class="fade-up fade-up-delay-3" style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:48px;">
      <a href="index.html" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go Home
      </a>
      <a href="courses.html" class="btn-secondary">Browse Courses</a>
      <a href="explore" class="btn-secondary">Explore Resources</a>
    </div>

    <div class="fade-up fade-up-delay-4" style="max-width:600px;margin:0 auto;">
      <h3 style="font-size:15px;font-weight:600;color:var(--heading);margin-bottom:16px;">Popular Pages</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;" id="popular-links"></div>
    </div>
  </div>
</section>

<div id="footer-root"></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
createNavbar(''); createFooter(); initPage();
document.getElementById('search-404').addEventListener('submit', function(e) {
  e.preventDefault();
  const q = document.getElementById('search-404-input').value.trim();
  if (q) window.location.href = 'explore?search=' + encodeURIComponent(q);
});
// Popular links
const links = document.getElementById('popular-links');
COURSES.forEach(c => {
  links.innerHTML += `<a href="semesters?course=${c.id}" style="text-decoration:none;padding:16px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:center;transition:var(--transition)" onmouseover="this.style.borderColor='var(--gold)'" onmouseout="this.style.borderColor='var(--border)'">
    <div style="font-size:14px;font-weight:600;color:var(--heading)">${c.name}</div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${c.semesters.length} Semesters</div></a>`;
});
</script>
</body>
</html>
