<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B2A4A">
  <title>Semester — ASCEND</title>
  <meta name="description" content="Access subject-wise resources for this semester.">
  <meta property="og:title" content="Semester — ASCEND">
  <meta property="og:image" content="New_Logo_Top.png">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="explore.css">
</head>
<body>
<div id="navbar-root"></div><div id="breadcrumb-root"></div>
<section class="sem-hero" id="main-content"><div class="container">
  <div class="sem-hero-content fade-up">
    <h1 class="sem-hero-title" id="sem-title"></h1>
    <p class="sem-hero-tagline" id="sem-tagline"></p>
    <p class="sem-hero-desc" id="sem-desc"></p>
    <div class="sem-hero-badges" id="sem-badges"></div>
  </div>
  <div class="sem-hero-image fade-up fade-up-delay-2"><img src="hero-desk.png" alt="Academic resources"></div>
</div></section>

<section class="subjects-section">
  <div class="container">
    <div class="subjects-toolbar fade-up">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="subject-search-input" placeholder="Search subjects..." autocomplete="off">
      </div>
      <div class="spec-filter" id="spec-filter"></div>
    </div>
    <div class="subject-list" id="subject-list"></div>
  </div>
</section>
<div id="footer-root"></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
  const courseId = getParam('course') || 'core';
  const semId = getParam('id') || '1';
  const course = getCourse(courseId);
  const sem = getSemester(courseId, semId);
  if (!course || !sem) { window.location.href = `semesters?course=${courseId}`; return; }

  document.title = `${course.name} — ${sem.name} — ASCEND`;
  createNavbar('courses'); createFooter();
  document.getElementById('breadcrumb-root').innerHTML = createBreadcrumb([
    {label:'Home',href:'index.html'},{label:'Courses',href:'courses.html'},
    {label:course.name,href:`semesters?course=${courseId}`},{label:sem.name}
  ]);
  document.getElementById('sem-title').textContent = sem.name;
  document.getElementById('sem-tagline').textContent = sem.tagline;
  document.getElementById('sem-desc').textContent = sem.description;
  document.getElementById('sem-badges').innerHTML = `<span class="badge">${course.name}</span><span class="badge">${sem.totalCredits} Credits</span><span class="badge">${sem.subjects.length} Subjects</span>`;

  // Specialization filter (Sem 2+ for MBA Core)
  const specFilter = document.getElementById('spec-filter');
  let activeSpec = 'all';
  if (course.specializations.length && parseInt(semId) > 1) {
    specFilter.innerHTML = `<div class="spec-tabs">
      <button class="spec-btn active" data-spec="all">All</button>
      <button class="spec-btn" data-spec="core">Core</button>
      ${course.specializations.map(sp=>`<button class="spec-btn" data-spec="${sp.id}">${sp.shortName}</button>`).join('')}
    </div>`;
    specFilter.querySelectorAll('.spec-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        specFilter.querySelectorAll('.spec-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        activeSpec = btn.dataset.spec;
        renderSubjects(document.getElementById('subject-search-input').value);
      });
    });
  }

  function renderSubjects(filter) {
    const list = document.getElementById('subject-list');
    let subjects = getSubjectsForSpec(sem.subjects, activeSpec);
    if (filter) subjects = subjects.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));
    
    // Group by category
    const groups = {core:[],specialization:[],elective:[]};
    subjects.forEach(sub => groups[sub.category]?.push(sub));
    
    let html = '';
    if (sem.electiveNote) {
      html += `<div class="subject-group-label fade-up" style="color:var(--accent-primary);font-style:italic">${sem.electiveNote} (${sem.electiveCreditsRequired} credits required)</div>`;
    }
    const groupLabels = {core:'Core Subjects',specialization:'Specialization Subjects',elective:'Open Elective Courses'};
    Object.entries(groups).forEach(([cat, subs]) => {
      if (!subs.length) return;
      html += `<div class="subject-group-label fade-up">${groupLabels[cat]}</div>`;
      subs.forEach((sub,i) => {
        const specLabel = sub.specializations.includes('all') ? '' : ` · ${sub.specializations.map(s=>s.toUpperCase()).join(', ')}`;
        html += `<a href="subject?course=${courseId}&sem=${semId}&sub=${sub.id}" class="subject-card fade-up" style="--accent:${sub.color}">
          <div class="subject-card-left" style="background:${sub.color}"></div>
          <div class="subject-card-body">
            <h3 class="subject-card-name">${sub.name}</h3>
            <p class="subject-card-meta">${sub.credits} Credit${sub.credits>1?'s':''} · ${sub.maxMarks} Marks (CA:${sub.ca} | TEE:${sub.tee}) · ${sub.tee===0 ? 'Fully Internal' : 'External'}${specLabel}</p>
          </div>
          <div class="subject-card-action">Open <span>→</span></div></a>`;
      });
    });
    list.innerHTML = html;
    const obs = new IntersectionObserver(e=>e.forEach(en=>{if(en.isIntersecting){en.target.classList.add('visible');obs.unobserve(en.target)}}),{threshold:0.08});
    list.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));
  }
  renderSubjects('');
  document.getElementById('subject-search-input').addEventListener('input', e => renderSubjects(e.target.value));
  initPage();
})();
</script>
</body>
</html>
